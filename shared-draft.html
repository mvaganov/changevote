<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shared Draft — competing edits, tracked and voted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F6F2;
    --paper-raised:#FFFFFF;
    --ink:#1E2523;
    --ink-soft:#5B6763;
    --ink-faint:#8B948F;
    --line:#DCE0D8;
    --line-strong:#C4CAC0;
    --accent:#2E6F66;
    --accent-dark:#1F4E48;
    --accent-soft:#E3EEEC;
    --add-bg:#E6F4E9;
    --add-fg:#1F6A3B;
    --add-strong:#B7E3C2;
    --del-bg:#FBEAE8;
    --del-fg:#A93A30;
    --del-strong:#F3BDB6;
    --shadow: 0 1px 2px rgba(30,37,34,0.04), 0 8px 24px -12px rgba(30,37,34,0.15);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
  }

  ::selection { background: var(--accent-soft); color: var(--accent-dark); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .page {
    max-width: 800px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  header.masthead {
    margin-bottom: 36px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 40px;
    line-height: 1.08;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  .lede {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 56ch;
    margin: 0;
  }

  section.card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }

  label.field-label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    font-family: 'Newsreader', serif;
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    resize: vertical;
    min-height: 130px;
  }

  textarea:focus { border-color: var(--accent); }

  textarea[readonly] {
    background: var(--paper);
    color: var(--ink-soft);
    cursor: default;
  }

  .topic-status {
    display:flex;
    align-items:center;
    gap:8px;
    margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .topic-status .dot {
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
  }

  .topic-status.editing .dot { background: var(--del-fg); }

  .topic-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  select#topicSelect {
    flex: 1 1 260px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid transparent;
    padding: 10px 16px;
    transition: transform 0.06s ease, background 0.15s ease, border-color 0.15s ease;
  }

  button:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-dark); }

  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--line-strong);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent-dark); }

  .btn-ghost:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn-ghost:disabled:hover { border-color: var(--line-strong); color: var(--ink-soft); }

  .inline-note {
    font-size: 12.5px;
    color: var(--del-fg);
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .inline-note.info { color: var(--ink-faint); }

  /* ---------- Edits section ---------- */

  #editsSection { display:none; }
  #editsSection.visible { display:block; }

  .edits-heading {
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    margin: 36px 0 14px;
  }

  .edits-heading h2 {
    font-family:'Newsreader', serif;
    font-weight: 500;
    font-size: 22px;
    margin:0;
  }

  .edits-heading .count {
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-faint);
  }

  .proposal-card {
    border: 1px dashed var(--line-strong);
    background: var(--paper-raised);
  }

  .proposal-card textarea {
    font-family:'Newsreader', serif;
    font-size: 15.5px;
    min-height: 110px;
  }

  .proposal-actions {
    display:flex;
    align-items:center;
    gap: 12px;
    margin-top: 12px;
  }

  .empty-state {
    font-size: 13.5px;
    color: var(--ink-faint);
    font-style: italic;
    padding: 4px 2px 2px;
  }

  /* ---------- Edit (diff) card ---------- */

  .edit-card {
    padding: 0;
    overflow: hidden;
  }

  .edit-card.excluded {
    opacity: 0.42;
    filter: grayscale(0.35);
  }

  .edit-card.drag-over-top { box-shadow: inset 0 3px 0 var(--accent), var(--shadow); }
  .edit-card.drag-over-bottom { box-shadow: inset 0 -3px 0 var(--accent), var(--shadow); }
  .edit-card.dragging { opacity: 0.5; }

  .edit-card-header {
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }

  .drag-handle {
    cursor: grab;
    color: var(--ink-faint);
    font-size: 15px;
    line-height: 1;
    padding: 4px 2px;
    user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }

  .edit-name {
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
  }

  .edit-stats {
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-faint);
  }
  .edit-stats .add-count { color: var(--add-fg); }
  .edit-stats .del-count { color: var(--del-fg); }

  .vote-toggle {
    margin-left: auto;
    display:flex;
    align-items:center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }

  .vote-toggle input {
    appearance: none;
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border: 1.5px solid var(--line-strong);
    border-radius: 50%;
    background: var(--paper-raised);
    display:grid;
    place-content:center;
    cursor: pointer;
    margin:0;
  }
  .vote-toggle input::after {
    content:"";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: transparent;
  }
  .vote-toggle input:checked {
    border-color: var(--accent);
    background: var(--accent);
  }
  .vote-toggle input:checked::after { background: #fff; }

  .vote-toggle .vote-label {
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
  .edit-card:not(.excluded) .vote-toggle .vote-label { color: var(--accent-dark); }

  .diff-body { padding: 6px 0; }

  .diff-row {
    display: grid;
    grid-template-columns: 42px 42px 18px 1fr;
    align-items: start;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    line-height: 1.65;
    border-left: 3px solid transparent;
  }

  .diff-row--same { background: transparent; }
  .diff-row--del { background: var(--del-bg); border-left-color: var(--del-fg); }
  .diff-row--add { background: var(--add-bg); border-left-color: var(--add-fg); }

  .ln {
    text-align: right;
    padding-right: 8px;
    color: var(--ink-faint);
    user-select: none;
  }
  .diff-row--del .ln-old { color: var(--del-fg); }
  .diff-row--add .ln-new { color: var(--add-fg); }

  .marker {
    text-align:center;
    color: var(--ink-faint);
    user-select: none;
  }
  .diff-row--del .marker { color: var(--del-fg); font-weight:600; }
  .diff-row--add .marker { color: var(--add-fg); font-weight:600; }

  .content {
    white-space: pre-wrap;
    word-break: break-word;
    padding: 0 12px 0 2px;
    color: var(--ink);
  }

  .tok-del {
    background: var(--del-strong);
    color: var(--del-fg);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    border-radius: 2px;
    padding: 0 1px;
  }
  .tok-add {
    background: var(--add-strong);
    color: var(--add-fg);
    font-weight: 600;
    border-radius: 2px;
    padding: 0 1px;
  }

  .vote-footer {
    margin-top: 8px;
    padding: 4px 2px 2px;
  }

  .vote-footer button { width: 100%; }

  .vote-footer .caption {
    text-align:center;
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 8px;
  }

  @media (max-width: 560px) {
    h1 { font-size: 30px; }
    .page { padding: 36px 16px 72px; }
    section.card { padding: 18px; }
    .diff-row { grid-template-columns: 30px 30px 16px 1fr; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="masthead">
    <p class="eyebrow">Collaborative drafting</p>
    <h1>Shared Draft</h1>
    <p class="lede">Start a topic, propose alternate versions of it, and watch each proposal render as a line-numbered diff. Any edit can be counted toward — or excluded from — the eventual vote.</p>
  </header>

  <section class="card">
    <label class="field-label" for="topicTextArea">Topic text</label>
    <textarea id="topicTextArea" placeholder="Write the text this topic is about…"></textarea>
    <div class="topic-status" id="topicStatus"></div>

    <div class="topic-row">
      <select id="topicSelect" aria-label="Select a topic"></select>
      <button class="btn-primary" id="startNewBtn">Start new topic</button>
    </div>
    <div class="inline-note" id="newTopicNote" style="display:none;"></div>
  </section>

  <div id="editsSection">
    <div class="edits-heading">
      <h2>Edits</h2>
      <span class="count" id="editsCount"></span>
    </div>

    <section class="card proposal-card">
      <label class="field-label" for="proposalTextArea">Propose an edit</label>
      <textarea id="proposalTextArea"></textarea>
      <div class="proposal-actions">
        <button class="btn-primary" id="proposeBtn">Propose edit</button>
      </div>
      <div class="inline-note" id="proposalNote" style="display:none;"></div>
    </section>

    <div id="editsList"></div>

    <div class="vote-footer">
      <button class="btn-ghost" id="voteBtn">Cast ranked-choice vote</button>
      <p class="caption" id="voteCaption"></p>
    </div>
  </div>

</div>

<script>
(function(){

  // ---------------- State ----------------
  let topics = [];          // { id, text, edits: [], nextEditNumber, proposalDraft }
  let selectedTopicId = 'new';
  let newTopicDraft = '';
  let idCounter = 1;

  function nextId(prefix){ return prefix + '-' + (idCounter++); }

  // ---------------- DOM refs ----------------
  const topicTextArea = document.getElementById('topicTextArea');
  const topicStatus = document.getElementById('topicStatus');
  const topicSelect = document.getElementById('topicSelect');
  const startNewBtn = document.getElementById('startNewBtn');
  const newTopicNote = document.getElementById('newTopicNote');

  const editsSection = document.getElementById('editsSection');
  const editsCount = document.getElementById('editsCount');
  const proposalTextArea = document.getElementById('proposalTextArea');
  const proposeBtn = document.getElementById('proposeBtn');
  const proposalNote = document.getElementById('proposalNote');
  const editsList = document.getElementById('editsList');
  const voteBtn = document.getElementById('voteBtn');
  const voteCaption = document.getElementById('voteCaption');

  // ---------------- Diff engine ----------------

  // Generic LCS-based array diff. Returns ops: {type:'same'|'del'|'add', oldItem, newItem}
  function diffArrays(oldArr, newArr){
    const n = oldArr.length, m = newArr.length;
    const dp = new Array(n + 1);
    for (let i = 0; i <= n; i++) dp[i] = new Int32Array(m + 1);
    for (let i = n - 1; i >= 0; i--){
      for (let j = m - 1; j >= 0; j--){
        dp[i][j] = (oldArr[i] === newArr[j])
          ? dp[i+1][j+1] + 1
          : Math.max(dp[i+1][j], dp[i][j+1]);
      }
    }
    const ops = [];
    let i = 0, j = 0;
    while (i < n && j < m){
      if (oldArr[i] === newArr[j]){
        ops.push({ type:'same', oldItem: oldArr[i], newItem: newArr[j] });
        i++; j++;
      } else if (dp[i+1][j] >= dp[i][j+1]){
        ops.push({ type:'del', oldItem: oldArr[i] });
        i++;
      } else {
        ops.push({ type:'add', newItem: newArr[j] });
        j++;
      }
    }
    while (i < n){ ops.push({ type:'del', oldItem: oldArr[i] }); i++; }
    while (j < m){ ops.push({ type:'add', newItem: newArr[j] }); j++; }
    return ops;
  }

  function tokenizeWords(line){
    return line.split(/(\s+)/).filter(t => t.length > 0);
  }

  // Produces a "Change": an ordered list of TextEdit-like rows describing
  // how to splice oldText into newText, with word-level detail on modified lines.
  function computeChange(oldText, newText){
    const oldLines = oldText.split('\n');
    const newLines = newText.split('\n');
    const rawOps = diffArrays(oldLines, newLines);

    const rows = [];
    let i = 0;
    while (i < rawOps.length){
      const op = rawOps[i];
      if (op.type === 'same'){
        rows.push({ type:'same', text: op.oldItem });
        i++;
        continue;
      }
      // Collect a contiguous run of non-'same' ops (a changed block)
      let j = i;
      const dels = [], adds = [];
      while (j < rawOps.length && rawOps[j].type !== 'same'){
        if (rawOps[j].type === 'del') dels.push(rawOps[j].oldItem);
        else adds.push(rawOps[j].newItem);
        j++;
      }
      const pairCount = Math.min(dels.length, adds.length);
      for (let k = 0; k < pairCount; k++){
        const wordOps = diffArrays(tokenizeWords(dels[k]), tokenizeWords(adds[k]));
        rows.push({ type:'del', text: dels[k], wordOps });
        rows.push({ type:'add', text: adds[k], wordOps });
      }
      for (let k = pairCount; k < dels.length; k++) rows.push({ type:'del', text: dels[k] });
      for (let k = pairCount; k < adds.length; k++) rows.push({ type:'add', text: adds[k] });
      i = j;
    }

    let oldNum = 1, newNum = 1;
    for (const row of rows){
      if (row.type === 'same'){ row.oldNum = oldNum++; row.newNum = newNum++; }
      else if (row.type === 'del'){ row.oldNum = oldNum++; row.newNum = null; }
      else { row.oldNum = null; row.newNum = newNum++; }
    }
    return rows;
  }

  function esc(s){
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function countChanges(rows){
    let add = 0, del = 0;
    for (const r of rows){
      if (r.type === 'add') add++;
      if (r.type === 'del') del++;
    }
    return { add, del };
  }

  function renderDiffRow(row){
    const oldNum = row.oldNum != null ? row.oldNum : '';
    const newNum = row.newNum != null ? row.newNum : '';

    if (row.type === 'same'){
      const content = esc(row.text) || '&nbsp;';
      return `<div class="diff-row diff-row--same">
        <span class="ln ln-old">${oldNum}</span><span class="ln ln-new">${newNum}</span>
        <span class="marker"> </span>
        <span class="content">${content}</span>
      </div>`;
    }

    if (row.type === 'del'){
      let content;
      if (row.wordOps){
        content = row.wordOps.filter(t => t.type !== 'add').map(t =>
          t.type === 'del'
            ? `<span class="tok-del">${esc(t.oldItem)}</span>`
            : `<span>${esc(t.oldItem)}</span>`
        ).join('');
      } else {
        content = `<span class="tok-del">${esc(row.text)}</span>`;
      }
      return `<div class="diff-row diff-row--del">
        <span class="ln ln-old">${oldNum}</span><span class="ln ln-new"></span>
        <span class="marker">&minus;</span>
        <span class="content">${content || '&nbsp;'}</span>
      </div>`;
    }

    // add
    let content;
    if (row.wordOps){
      content = row.wordOps.filter(t => t.type !== 'del').map(t =>
        t.type === 'add'
          ? `<span class="tok-add">${esc(t.newItem)}</span>`
          : `<span>${esc(t.newItem)}</span>`
      ).join('');
    } else {
      content = `<span class="tok-add">${esc(row.text)}</span>`;
    }
    return `<div class="diff-row diff-row--add">
      <span class="ln ln-old"></span><span class="ln ln-new">${newNum}</span>
      <span class="marker">+</span>
      <span class="content">${content || '&nbsp;'}</span>
    </div>`;
  }

  // ---------------- Helpers ----------------

  function currentTopic(){
    return topics.find(t => t.id === selectedTopicId) || null;
  }

  function topicLabel(topic){
    const firstLine = (topic.text.split('\n')[0] || '').trim() || '(untitled topic)';
    return firstLine.length > 60 ? firstLine.slice(0, 60) + '…' : firstLine;
  }

  function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = Math.max(el.scrollHeight, 130) + 'px';
  }

  // ---------------- Rendering ----------------

  function renderTopicSelect(){
    topicSelect.innerHTML = '';
    const newOpt = document.createElement('option');
    newOpt.value = 'new';
    newOpt.textContent = 'new topic';
    topicSelect.appendChild(newOpt);

    for (const t of topics){
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = topicLabel(t);
      topicSelect.appendChild(opt);
    }
    topicSelect.value = selectedTopicId;
  }

  function renderTopicTextArea(){
    const topic = currentTopic();
    if (selectedTopicId === 'new'){
      topicTextArea.value = newTopicDraft;
      topicTextArea.readOnly = false;
      startNewBtn.style.display = '';
      topicStatus.classList.add('editing');
      topicStatus.innerHTML = `<span class="dot"></span> Drafting a new topic — editable`;
    } else if (topic){
      topicTextArea.value = topic.text;
      topicTextArea.readOnly = true;
      startNewBtn.style.display = 'none';
      topicStatus.classList.remove('editing');
      topicStatus.innerHTML = `<span class="dot"></span> Locked — select "new topic" to draft another`;
    }
  }

  function renderEditsSection(){
    const topic = currentTopic();
    if (selectedTopicId === 'new' || !topic){
      editsSection.classList.remove('visible');
      return;
    }
    editsSection.classList.add('visible');

    proposalTextArea.value = topic.proposalDraft;
    editsCount.textContent = topic.edits.length === 1 ? '1 proposal' : `${topic.edits.length} proposals`;

    if (topic.edits.length === 0){
      editsList.innerHTML = `<p class="empty-state">No edits proposed yet — draft one above and press "Propose edit".</p>`;
    } else {
      editsList.innerHTML = topic.edits.map(edit => {
        const stats = countChanges(edit.change);
        const diffHtml = edit.change.map(renderDiffRow).join('');
        return `<section class="card edit-card ${edit.voteChecked ? '' : 'excluded'}" draggable="true" data-edit-id="${edit.id}">
          <div class="edit-card-header">
            <span class="drag-handle" title="Drag to reorder">&#10247;</span>
            <span class="edit-name">Edit #${edit.number}</span>
            <span class="edit-stats"><span class="add-count">+${stats.add}</span> <span class="del-count">−${stats.del}</span></span>
            <label class="vote-toggle">
              <input type="checkbox" data-vote-edit-id="${edit.id}" ${edit.voteChecked ? 'checked' : ''} aria-label="Count edit ${edit.number} toward vote" />
              <span class="vote-label">${edit.voteChecked ? 'Counts toward vote' : 'Excluded from tally'}</span>
            </label>
          </div>
          <div class="diff-body">${diffHtml}</div>
        </section>`;
      }).join('');
    }

    const hasEdits = topic.edits.length > 0;
    voteBtn.disabled = !hasEdits;
    voteCaption.textContent = hasEdits
      ? 'Tallying isn\'t wired up yet — this is a placeholder for ranked-choice voting.'
      : 'Propose at least one edit to enable voting.';
  }

  function render(){
    renderTopicSelect();
    renderTopicTextArea();
    renderEditsSection();
  }

  // ---------------- Actions ----------------

  function selectTopic(id){
    selectedTopicId = id;
    if (id === 'new'){
      newTopicDraft = '';
    }
    hideNote(newTopicNote);
    hideNote(proposalNote);
    render();
    if (id === 'new') topicTextArea.focus();
  }

  function startNewTopic(){
    const text = topicTextArea.value.trim();
    if (!text){
      showNote(newTopicNote, 'Add some text before starting a topic.');
      topicTextArea.focus();
      return;
    }
    const topic = {
      id: nextId('topic'),
      text: text,
      edits: [],
      nextEditNumber: 1,
      proposalDraft: text
    };
    topics.push(topic);
    selectedTopicId = topic.id;
    hideNote(newTopicNote);
    render();
  }

  function proposeEdit(){
    const topic = currentTopic();
    if (!topic) return;
    const proposedText = proposalTextArea.value;

    if (proposedText.trim() === topic.text.trim()){
      showNote(proposalNote, 'This matches the current topic text — nothing to propose.');
      return;
    }
    hideNote(proposalNote);

    const change = computeChange(topic.text, proposedText);
    const edit = {
      id: nextId('edit'),
      number: topic.nextEditNumber++,
      proposedText: proposedText,
      change: change,
      voteChecked: true
    };
    topic.edits.unshift(edit); // appears directly below the Edit Proposal box
    topic.proposalDraft = topic.text; // reset the proposal box to the baseline
    render();
  }

  function toggleVote(editId){
    const topic = currentTopic();
    if (!topic) return;
    const edit = topic.edits.find(e => e.id === editId);
    if (!edit) return;
    edit.voteChecked = !edit.voteChecked;
    render();
  }

  function showNote(el, msg){ el.textContent = msg; el.style.display = ''; }
  function hideNote(el){ el.textContent = ''; el.style.display = 'none'; }

  // ---------------- Drag and drop reordering ----------------

  let dragSrcId = null;

  function attachDragHandlers(){
    editsList.addEventListener('dragstart', (e) => {
      const card = e.target.closest('.edit-card');
      if (!card) return;
      dragSrcId = card.dataset.editId;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragSrcId); } catch(err){}
    });

    editsList.addEventListener('dragend', (e) => {
      const card = e.target.closest('.edit-card');
      if (card) card.classList.remove('dragging');
      editsList.querySelectorAll('.edit-card').forEach(c => {
        c.classList.remove('drag-over-top', 'drag-over-bottom');
      });
      dragSrcId = null;
    });

    editsList.addEventListener('dragover', (e) => {
      const card = e.target.closest('.edit-card');
      if (!card || !dragSrcId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = card.getBoundingClientRect();
      const isTopHalf = (e.clientY - rect.top) < rect.height / 2;
      card.classList.toggle('drag-over-top', isTopHalf);
      card.classList.toggle('drag-over-bottom', !isTopHalf);
    });

    editsList.addEventListener('dragleave', (e) => {
      const card = e.target.closest('.edit-card');
      if (card) card.classList.remove('drag-over-top', 'drag-over-bottom');
    });

    editsList.addEventListener('drop', (e) => {
      const card = e.target.closest('.edit-card');
      if (!card || !dragSrcId) return;
      e.preventDefault();
      const targetId = card.dataset.editId;
      card.classList.remove('drag-over-top', 'drag-over-bottom');
      if (targetId === dragSrcId) return;

      const topic = currentTopic();
      if (!topic) return;
      const rect = card.getBoundingClientRect();
      const isTopHalf = (e.clientY - rect.top) < rect.height / 2;

      const srcIndex = topic.edits.findIndex(ed => ed.id === dragSrcId);
      if (srcIndex === -1) return;
      const [moved] = topic.edits.splice(srcIndex, 1);

      let targetIndex = topic.edits.findIndex(ed => ed.id === targetId);
      if (targetIndex === -1) targetIndex = topic.edits.length;
      const insertAt = isTopHalf ? targetIndex : targetIndex + 1;
      topic.edits.splice(insertAt, 0, moved);

      render();
    });

    editsList.addEventListener('change', (e) => {
      if (e.target.matches('[data-vote-edit-id]')){
        toggleVote(e.target.dataset.voteEditId);
      }
    });
  }

  // ---------------- Wire up static controls ----------------

  topicSelect.addEventListener('change', () => selectTopic(topicSelect.value));
  startNewBtn.addEventListener('click', startNewTopic);
  proposeBtn.addEventListener('click', proposeEdit);
  voteBtn.addEventListener('click', () => { /* ranked-choice voting: not yet implemented */ });

  topicTextArea.addEventListener('input', () => {
    if (selectedTopicId === 'new'){
      newTopicDraft = topicTextArea.value;
      hideNote(newTopicNote);
    }
    autoGrow(topicTextArea);
  });

  proposalTextArea.addEventListener('input', () => {
    const topic = currentTopic();
    if (topic){
      topic.proposalDraft = proposalTextArea.value;
      hideNote(proposalNote);
    }
    autoGrow(proposalTextArea);
  });

  attachDragHandlers();
  render();

})();
</script>

</body>
</html>
